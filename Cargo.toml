[package]
name = "ductdelta"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[dependencies]
axum = "0.8.9"
postgres = { version = "0.19.14", features = ["with-serde_json-1", "with-time-0_3", "with-uuid-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["serde", "v4"] }
