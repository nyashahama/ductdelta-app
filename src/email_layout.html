<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{heading}</title>
</head>
<body style="margin:0;padding:0;background:#f3f6f4;color:#172a21;font-family:'Public Sans','Segoe UI',Arial,sans-serif">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         bgcolor="#f3f6f4" style="width:100%;background:#f3f6f4">
    <tr>
      <td align="center" style="padding:32px 12px">
        <!--[if mso]><table role="presentation" width="560" align="center"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               bgcolor="#ffffff" style="width:100%;max-width:560px;border:1px solid #dce5de;border-top:4px solid #166534;border-radius:12px">
          <tr>
            <td style="padding:28px 26px 24px">
              <p style="margin:0 0 24px;color:#166534;font-size:19px;font-weight:bold;letter-spacing:-0.35px">DuctDelta</p>
              <h1 style="margin:0 0 12px;color:#172a21;font-size:28px;line-height:1.2;letter-spacing:-0.55px">{heading}</h1>
              <p style="margin:0;font-size:16px;line-height:1.6;overflow-wrap:anywhere">{message}</p>
              {action}
              <p style="margin:22px 0 0;padding:12px 14px;background:#eff6f0;border-radius:6px;color:#33473b;font-size:14px;line-height:1.55">{detail}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 26px 22px;border-top:1px solid #dce5de;color:#475b50;font-size:13px;line-height:1.55">
              <p style="margin:0">Sent by DuctDelta</p>
              {support}
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
